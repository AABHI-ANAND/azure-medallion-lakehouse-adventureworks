<svg viewBox="0 0 1400 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="340" fill="#FBFBFA"/>

  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1B1B">Azure Medallion Lakehouse — AdventureWorks Sales Analytics</text>
  <text x="700" y="52" text-anchor="middle" font-size="13" fill="#666666">Bronze → Silver → Gold pipeline: Azure Data Factory · Databricks · Synapse Serverless SQL · Power BI</text>

  <!-- Box 1: GitHub -->
  <rect x="20" y="75" width="220" height="100" rx="12" ry="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#0A3D62">GitHub</text>
  <text x="130" y="128" text-anchor="middle" font-size="10.5" fill="#444444">11 AdventureWorks</text>
  <text x="130" y="142" text-anchor="middle" font-size="10.5" fill="#444444">CSV source files</text>

  <line x1="240" y1="125" x2="298" y2="125" stroke="#555555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Box 2: ADF -->
  <rect x="300" y="75" width="220" height="100" rx="12" ry="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/>
  <text x="410" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#0A3D62">Azure Data Factory</text>
  <text x="410" y="128" text-anchor="middle" font-size="10.5" fill="#444444">Lookup → ForEach →</text>
  <text x="410" y="142" text-anchor="middle" font-size="10.5" fill="#444444">parameterized HTTP sink</text>

  <line x1="520" y1="125" x2="578" y2="125" stroke="#555555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Box 3: Databricks -->
  <rect x="580" y="75" width="220" height="100" rx="12" ry="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/>
  <text x="690" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#0A3D62">Azure Databricks</text>
  <text x="690" y="128" text-anchor="middle" font-size="10.5" fill="#444444">PySpark transforms ·</text>
  <text x="690" y="142" text-anchor="middle" font-size="10.5" fill="#444444">Service Principal + Secret Scope</text>

  <line x1="800" y1="125" x2="858" y2="125" stroke="#555555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Box 4: Synapse -->
  <rect x="860" y="75" width="220" height="100" rx="12" ry="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/>
  <text x="970" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#0A3D62">Azure Synapse</text>
  <text x="970" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#0A3D62">Serverless SQL</text>
  <text x="970" y="138" text-anchor="middle" font-size="10.5" fill="#444444">Managed Identity credential ·</text>
  <text x="970" y="152" text-anchor="middle" font-size="10.5" fill="#444444">External Data Source + Views</text>

  <line x1="1080" y1="125" x2="1138" y2="125" stroke="#555555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Box 5: Power BI -->
  <rect x="1140" y="75" width="220" height="100" rx="12" ry="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/>
  <text x="1250" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#0A3D62">Power BI</text>
  <text x="1250" y="128" text-anchor="middle" font-size="10.5" fill="#444444">Connected via</text>
  <text x="1250" y="142" text-anchor="middle" font-size="10.5" fill="#444444">Synapse SQL Endpoint</text>

  <!-- Connector lines from box bottom to layer tags -->
  <line x1="410" y1="175" x2="410" y2="195" stroke="#CD7F32" stroke-width="2"/>
  <line x1="690" y1="175" x2="690" y2="195" stroke="#9E9E9E" stroke-width="2"/>
  <line x1="970" y1="175" x2="970" y2="195" stroke="#D4AF37" stroke-width="2"/>

  <!-- Layer tags -->
  <rect x="300" y="195" width="220" height="28" rx="6" ry="6" fill="#CD7F32"/>
  <text x="410" y="213" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">BRONZE — Raw Landing</text>

  <rect x="580" y="195" width="220" height="28" rx="6" ry="6" fill="#9E9E9E"/>
  <text x="690" y="213" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">SILVER — Cleaned &amp; Transformed</text>

  <rect x="860" y="195" width="220" height="28" rx="6" ry="6" fill="#D4AF37"/>
  <text x="970" y="213" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">GOLD — Curated Views</text>

  <!-- Explanatory note -->
  <text x="700" y="258" text-anchor="middle" font-size="12.5" fill="#555555">All three layers are landed in Azure Data Lake Storage Gen2 (ADLS Gen2), accessed via Managed Identity — no hardcoded credentials.</text>

  <text x="700" y="315" text-anchor="middle" font-size="11" fill="#999999">github.com/AABHI-ANAND</text>
</svg>
